<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2F6A4F" />
    <meta name="description" content="Registrá los gastos de tu hogar y compartilos con tu familia." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Organizador de Gastos</title>
    <script>
      // Aplicamos el tema ANTES de cargar CSS/JS para evitar el destello.
      try {
        var t = localStorage.getItem('gastos:theme')
        if (t === 'cool' || t === 'oscuro') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
